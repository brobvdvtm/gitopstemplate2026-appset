apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dev-devfront
  namespace: argocd
spec:
  description: Development applications owned by devfront, rendered from applications/devfront/*/overlays/dev

  sourceRepos:
    - https://github.com/CHANGEME/gitops-apps.git

  # Hard guardrail on the [environment]-[team]-[application] namespace
  # convention: a dev devfront Application can only ever land in a
  # dev-devfront-* namespace.
  destinations:
    - server: https://kubernetes.default.svc
      namespace: 'dev-devfront-*'

  # Tighten these if you want to forbid apps from shipping cluster-scoped
  # resources. Namespace must stay allowed for CreateNamespace=true to work.
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'

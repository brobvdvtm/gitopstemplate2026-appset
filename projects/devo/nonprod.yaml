apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: nonprod-devo
  namespace: argocd
spec:
  description: Non-production applications owned by devo, rendered from applications/devo/*/overlays/nonprod

  sourceRepos:
    - https://github.com/CHANGEME/gitops-apps.git

  # Hard guardrail on the [environment]-[team]-[application] namespace
  # convention: a nonprod devo Application can only ever land in a
  # nonprod-devo-* namespace.
  destinations:
    - server: https://kubernetes.default.svc
      namespace: 'nonprod-devo-*'

  # Tighten these if you want to forbid apps from shipping cluster-scoped
  # resources. Namespace must stay allowed for CreateNamespace=true to work.
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'

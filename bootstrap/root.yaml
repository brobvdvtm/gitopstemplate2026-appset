# App-of-apps bootstrap. Apply once by hand:
#   kubectl apply -f bootstrap/root.yaml
# From then on, projects/ and applicationsets/ are managed by Argo CD itself.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-projects
  namespace: argocd
  annotations:
    # Projects must exist before the ApplicationSets reference them.
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/CHANGEME/gitops-apps.git
    targetRevision: main
    path: projects
    directory:
      # AppProjects stay grouped per team (projects/<team>/<env>.yaml), so this
      # source has to descend past the top level.
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-applicationsets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/CHANGEME/gitops-apps.git
    targetRevision: main
    path: applicationsets
    directory:
      # One flat file per environment, no subdirectories to descend into.
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

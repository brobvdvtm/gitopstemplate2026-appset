apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# NOTE: do not set `namespace:` here.
# The namespace is owned by the ApplicationSet destination ([overlay]-[app]).

labels:
  - pairs:
      environment: prod
    # keep selectors stable; label pods too
    includeSelectors: false
    includeTemplates: true

resources:
  - ../../base

replicas:
  - name: podinfo
    count: 3

patches:
  - target:
      kind: Deployment
      name: podinfo
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "prod"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 100m

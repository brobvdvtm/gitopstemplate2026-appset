  <title
     id="t">ApplicationSet scoping</title>
  <desc
     id="d">The prod ApplicationSet selects overlays with the glob applications/*/*/overlays/prod. Two overlay directories match and become Applications; base directories, preview.yaml files, deeper paths, absent directories and unknown environments are ignored.</desc>
